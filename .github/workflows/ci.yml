# The gates every PR must pass — the same commands everyone runs locally
# (TEAM-PLAN.md "Rules"). No phone, no keys: the app suite runs on the mocks,
# the proxy suite on faked upstreams.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: app (typecheck, lints, jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aisle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aisle/package-lock.json
      - run: npm ci
      - run: npm run lint
      # React Native renderer startup can exceed an individual test's 5 s timeout
      # when GitHub's two-core runner executes many Jest workers concurrently.
      - run: npx jest --ci --runInBand
  server:
    name: proxy (tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aisle/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            aisle/package-lock.json
            aisle/server/package-lock.json
      # The proxy shares src/core/contracts.ts and src/outdoor/plannerJobs.ts with the app,
      # and the app's tsconfig extends expo's: the app's node_modules must be there too.
      - run: npm ci
        working-directory: aisle
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
